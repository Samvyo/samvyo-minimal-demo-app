<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samvyo Demo</title>
    <!-- <script src="samvyo-js.js"> -->
    </script>
    <!-- Ensure this path is correct -->
    <script src="https://unpkg.com/samvyo-js-sdk@latest/dest/samvyo-js-sdk.js"></script>
    <script src="script.js" defer></script>
    <style>
        video {
            width: 300px;
            height: 200px;
            border: 1px solid black;
        }

        .peer-card,
        .ss-card {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            margin: 10px 0;
            width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;  
        }

        .peer-card video,
        .ss-card video {
            width: 100%;
            height: auto;
            border: 1px solid black;
        }

        .peer-list,
        .screen-share-list {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .peer-media {
            display: flex;
            padding-right: 20px;
        }

        .device-list {
            margin-top: 20px;
            display: flex;
            width: 30vw;
            justify-content: space-between;
            margin-bottom: 20px;

        }

        .join-room {
            width: 30vw;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #audioInput {
            margin-right: 10px;
            width: 14.5vw;

        }

        #videoInput {
            display: flex;
            width: 14.5vw;
        }
    </style>
</head>

<body>
    <h1>Samvyo Demo</h1>
    <!-- <div>
        <video id="localVideo" autoplay muted></video>
        <video id="remoteVideo" autoplay></video>
    </div> -->
    <form type="submit" class="join-room">
        <input id="roomId" placeholder="Enter room Id" required></input>
        <input id="peerName" placeholder="Enter peerName"></input>
        <button id="initButton">Init Room</button>
    </form>

    <div class="device-list">
        <div>
            <label for="audioInput">Choose audio input:</label>
            <select id="audioInput">
                <option value="">Select Audio Device</option>
            </select>
        </div>
        <div>
            <label for="videoInput">Choose video input:</label>
            <select id="videoInput">
                <option value="">Select Video Device</option>
            </select>
        </div>
    </div>
    <button id="joinButton" disabled> Join Room</button>
    <button id="leaveButton" disabled>Leave Room</button>
    <button id="closeButton" disabled>Close Roo</button>
    <div id="additional"></div>
    <div id="notification"></div>
    <div class="peer-list" id="peerList">
        <!-- Peers will be listed here added new name  -->
         <!-- // sai prasad -->
          <div>
            sai prasad
          </div>

    </div>
    <div class="screen-share-list" id="screenShareList">

    </div>
    <div id="captionsContainer" style="position:fixed; left:0; right:0; bottom:12px; z-index:1000; display:none;">
        <div id="captionsPanel"
            style="margin:0 auto; max-width:800px; background: rgba(0,0,0,0.55); color:#fff; border-radius:8px; padding:8px 10px; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;">
            <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; padding-bottom:6px;">
                <strong style="font-size:14px; opacity:0.9;">Live Captions</strong>
                <span id="captionsHint" style="font-size:11px; opacity:0.8;">Transcription is on</span>
            </div>
            <div id="captionsFeed" style="max-height:180px; overflow-y:auto; font-size:13px; line-height:1.35;"></div>
        </div>
    </div>
</body>

</html>
