# ─────────────────────────────────────────────────────────────────────────────
# electron-builder.yml  —  Desktop App Packaging Configuration
#
# WHAT IS electron-builder?
#   A tool that takes your Electron app + source files and produces
#   a real installable binary for each OS:
#     Windows  → .exe installer (NSIS) + portable .exe
#     macOS    → .dmg disk image
#     Linux    → .AppImage (runs on any distro) + .deb (Ubuntu/Debian)
#
# HOW TO USE:
#   npm run dist:linux   → build for Linux  (run on Linux machine)
#   npm run dist:win     → build for Windows
#   npm run dist:mac     → build for macOS  (run on macOS machine)
#   npm run dist:all     → build all three  (best done in CI/GitHub Actions)
#
# NO CODE SIGNING configured here intentionally.
# Users will see an OS warning on first launch — acceptable for internal demos.
# ─────────────────────────────────────────────────────────────────────────────

# ── App Identity ──────────────────────────────────────────────────────────────

appId: com.samvyo.desktop
productName: Samvyo
copyright: Copyright © 2026 Samvyo Technologies

# ── Output & Build Resources ──────────────────────────────────────────────────

directories:
  output: release
  buildResources: assets

# ── asar: false ───────────────────────────────────────────────────────────────
# By default electron-builder packs source files into an .asar archive.
# We MUST disable this because:
#   child_process.fork() cannot run a file from inside an .asar archive.
#   server.js is forked as a child process by electron/main.js — it needs
#   to exist as a real file on disk, not inside a virtual archive.
# With asar: false, all files are extracted to disk on install — fork() works.
asar: false

# ── Files to Include in the Package ──────────────────────────────────────────
# electron-builder bundles ONLY the files listed here.
# node_modules (production only) are added automatically by electron-builder.

files:
  # Electron process files (main, preload, menu)
  - electron/**/*

  # Web UI served by Express (index.html, script.js)
  - public/**/*

  # Express HTTPS server — forked as a child process at runtime
  - server.js

  # TLS certificate files — required by server.js to start HTTPS
  - server.key
  - server.crt

  # API credentials — ACCESS_KEY and SECRET_ACCESS_KEY for Samvyo SDK
  # WARNING: bundling .env means credentials are inside the installer.
  # For production: use OS keychain or prompt user for keys instead.
  - .env

  # package.json — required for Node.js module resolution at runtime
  - package.json

  # App icons — used by the OS taskbar, dock, and app launcher
  - assets/**/*

# ── Windows Configuration ─────────────────────────────────────────────────────
win:
  icon: assets/icons/win/icon.ico
  target:
    - target: nsis      # Full installer with Add/Remove Programs entry
    - target: portable  # Single .exe, no installation needed

nsis:
  oneClick: false                        # Show installer wizard, not silent install
  perMachine: false                      # Install per-user (no admin/UAC prompt)
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# ── macOS Configuration ───────────────────────────────────────────────────────
mac:
  icon: assets/icons/mac/icon.icns
  category: public.app-category.business
  # Info.plist usage descriptions required by macOS for camera and microphone.
  # Without these, macOS silently denies access in packaged builds.
  extendInfo:
    NSCameraUsageDescription: "Samvyo needs camera access to show your video in meetings."
    NSMicrophoneUsageDescription: "Samvyo needs microphone access for audio in meetings."
  target:
    - target: dmg   # Standard macOS distribution format
      arch:
        - x64    # Intel Macs (pre-2020)
        - arm64  # Apple Silicon (M1/M2/M3)
    - target: zip   # Zip of .app bundle (needed for auto-update later)
      arch:
        - x64
        - arm64
  # hardenedRuntime and notarization intentionally omitted — unsigned build.
  # Users bypass Gatekeeper via: right-click → Open → Open

# ── Linux Configuration ───────────────────────────────────────────────────────
linux:
  icon: assets/icons/png
  category: Network;VideoConference
  target:
    - target: AppImage  # Runs on any Linux distro without installation
    - target: deb       # Ubuntu/Debian package

  # --no-sandbox is required on many Linux systems where the kernel does not
  # grant Chromium's sandbox the privileges it needs (most Ubuntu setups).
  # Without this flag, the Electron app launches but the window never appears.
  executableArgs:
    - --no-sandbox

# ── publish: disabled ────────────────────────────────────────────────────────
publish: null
