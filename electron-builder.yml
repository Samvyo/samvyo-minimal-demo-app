# ─────────────────────────────────────────────────────────────────────────────
# electron-builder.yml  —  Desktop App Packaging Configuration
#
# WHAT IS electron-builder?
#   A tool that takes your Electron app + source files and produces
#   a real installable binary for each OS:
#     Windows  → .exe installer (NSIS) + portable .exe
#     macOS    → .dmg disk image
#     Linux    → .AppImage (runs on any distro) + .deb (Ubuntu/Debian)
#
# HOW TO USE:
#   npm run dist:linux   → build for Linux  (run on Linux machine)
#   npm run dist:win     → build for Windows
#   npm run dist:mac     → build for macOS  (run on macOS machine)
#   npm run dist:all     → build all three  (best done in CI/GitHub Actions)
#
# NO CODE SIGNING configured here intentionally.
# Users will see an OS warning on first launch — that is acceptable for
# internal demo/testing use. See the implementation plan Phase 5 for
# signing setup when ready.
# ─────────────────────────────────────────────────────────────────────────────

# ── App Identity ──────────────────────────────────────────────────────────────

# appId: Unique reverse-domain identifier for this app.
# Used by the OS to identify the app for notifications, deep links, etc.
# Must be unique — do not reuse another app's ID.
appId: com.samvyo.desktop

# productName: The human-readable name shown to users.
# Appears in: installer window title, Start Menu, Applications folder, taskbar.
productName: Samvyo

# copyright: Shown in the installer and About dialog.
copyright: Copyright © 2026 Samvyo Technologies

# ── Output Directory ──────────────────────────────────────────────────────────

directories:
  # output: where electron-builder writes the finished installers.
  # After running dist:linux you'll find Samvyo.AppImage in ./release/
  output: release

  # buildResources: folder where electron-builder looks for icon files
  # and other build assets (e.g. NSIS installer background image).
  buildResources: assets

# ── Files to Include in the Package ──────────────────────────────────────────
# electron-builder bundles ONLY the files listed here into the installer.
# Everything else (node_modules source, .git, test files) is excluded.
#
# The packaged app structure inside the installer will be:
#   resources/app/
#     ├── electron/         ← Electron main, preload, menu
#     ├── public/           ← index.html, script.js (the web UI)
#     ├── server.js         ← Express HTTPS server
#     ├── server.key        ← TLS private key
#     ├── server.crt        ← TLS certificate
#     ├── .env              ← API credentials (ACCESS_KEY, SECRET_ACCESS_KEY)
#     └── package.json      ← needed by Node.js require() resolution

files:
  # Electron process files
  - electron/**/*

  # The web UI served by Express
  - public/**/*

  # Express HTTPS server entry point
  - server.js

  # TLS certificate files — required by server.js to start HTTPS
  # WARNING: these are self-signed certs. For production, replace with
  # proper certs or move to HTTP-only for desktop (Electron = secure context)
  - server.key
  - server.crt

  # Environment variables — API keys for the Samvyo SDK
  # WARNING: bundling .env means credentials are inside the installer.
  # For a production release: use OS keychain or prompt user for keys instead.
  - .env

  # package.json is required so Node.js can resolve module paths at runtime
  - package.json

  # Icon assets bundled into the app package
  - assets/**/*

# node_modules are handled separately by electron-builder (it re-installs
# only production dependencies into the package, excluding devDependencies)

# ── Windows Configuration ─────────────────────────────────────────────────────
win:
  # Icon for Windows: .ico generated by electron-icon-builder from assets/icon.png
  # Path: assets/icons/win/icon.ico  (multi-size: 16/32/48/256 px packed in one file)
  icon: assets/icons/win/icon.ico

  # targets: what installer formats to produce
  # nsis     → a proper Windows installer (.exe) with Add/Remove Programs entry
  # portable → a single .exe that runs without installation (no admin needed)
  target:
    - target: nsis
    - target: portable

# NSIS installer configuration (Windows installer behaviour)
nsis:
  # oneClick: false → show the installer wizard (language, path, shortcuts)
  # true would silently install with defaults — less user control
  oneClick: false

  # perMachine: false → install for the current user only (no admin/UAC prompt)
  # true would install system-wide and require administrator privileges
  perMachine: false

  # allowToChangeInstallationDirectory: true → user can choose install folder
  allowToChangeInstallationDirectory: true

  # createDesktopShortcut: true → place a shortcut on the user's desktop
  createDesktopShortcut: true

  # createStartMenuShortcut: true → add Samvyo to the Windows Start Menu
  createStartMenuShortcut: true

# ── macOS Configuration ───────────────────────────────────────────────────────
mac:
  # Icon for macOS: .icns generated by electron-icon-builder from assets/icon.png
  # Path: assets/icons/mac/icon.icns
  icon: assets/icons/mac/icon.icns

  # App category: shown in the Mac App Store (if ever distributed there)
  # and used by macOS Spotlight for app classification
  category: public.app-category.business

  # targets:
  # dmg → .dmg disk image (standard macOS distribution format)
  # zip → .zip of the .app bundle (needed if auto-update is added later)
  target:
    - target: dmg
    - target: zip

  # NOTE: hardenedRuntime and notarization are intentionally omitted.
  # Unsigned macOS builds will show "cannot be opened" by default.
  # Users can right-click → Open → Open to bypass Gatekeeper.
  # For production: add Apple Developer ID credentials and set hardenedRuntime: true

# ── Linux Configuration ───────────────────────────────────────────────────────
linux:
  # Icon for Linux: directory of PNGs at multiple sizes (electron-icon-builder output)
  # electron-builder reads all sizes from the folder for the .desktop file
  icon: assets/icons/png

  # App category for Linux desktop environments
  # Used by .desktop file to categorise the app in the system menu
  category: Network;VideoConference

  # targets:
  # AppImage → single file, runs on ANY Linux distro without installation
  #            user just chmod +x and double-click — most portable option
  # deb       → .deb package for Ubuntu/Debian — installs via apt or dpkg
  target:
    - target: AppImage
    - target: deb

# ── publish: disabled (no code signing, no update server) ────────────────────
# publish: null tells electron-builder not to try to upload artifacts anywhere.
# When code signing and auto-update are added in Phase 5, this would be:
#   publish:
#     provider: github   # or 'generic' for self-hosted
publish: null
